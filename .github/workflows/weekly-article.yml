name: Generate weekly GitHub article

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build article from public activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_weekly_article.py
      - name: Publish article
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles
          git diff --cached --quiet || (git commit -m "docs: publish weekly GitHub article" && git push)
