name: Refresh GitHub activity data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GitHub activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_recent_activity.py
      - name: Publish activity data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/recent-activity.json
          git diff --cached --quiet || (git commit -m "chore: refresh GitHub activity data" && git push)
